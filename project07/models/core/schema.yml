version: 2

models:
  - name: dim_customer
    description: "Customer dimension with PII masked. One row per unique device."
    columns:
      - name: customer_key
        description: "Surrogate key for customer"
        tests:
          - not_null
          - unique
      - name: device_id
        description: "Device identifier (natural key)"
        tests:
          - not_null
      - name: ip_hashed
        description: "MD5 hashed IP address (PII masked)"
      - name: email_hashed
        description: "MD5 hashed email address (PII masked)"
      - name: has_email
        description: "Boolean flag indicating if customer provided email"
      - name: created_at
        description: "Record creation timestamp"
      - name: updated_at
        description: "Record update timestamp"

  - name: dim_product
    description: "Product dimension from Glamira EU store"
    columns:
      - name: product_key
        description: "Surrogate key for product"
        tests:
          - not_null
          - unique
      - name: product_id
        description: "Natural key from Glamira product catalog"
        tests:
          - not_null
      - name: product_type
        description: "Standardized product type"
      - name: gender
        description: "Target gender: Women, Men, Unisex"
      - name: created_at
        description: "Record creation timestamp"
      - name: updated_at
        description: "Record update timestamp"

  - name: dim_date
    description: "Date dimension covering Apr 2020 - Mar 2021"
    columns:
      - name: date_key
        description: "Integer date key in YYYYMMDD format"
        tests:
          - not_null
          - unique
      - name: is_weekend
        description: "Boolean flag for weekend days"
      - name: created_at
        description: "Record creation timestamp"
      - name: updated_at
        description: "Record update timestamp"

  - name: dim_location
    description: "Geographic dimension from IP geolocation data"
    columns:
      - name: location_key
        description: "Surrogate key for location"
        tests:
          - not_null
          - unique
      - name: country_code
        description: "ISO country code"
      - name: country_name
        description: "Full country name"
      - name: region_name
        description: "Region or state name"
      - name: city_name
        description: "City name"
      - name: created_at
        description: "Record creation timestamp"
      - name: updated_at
        description: "Record update timestamp"

  - name: dim_store
    description: "Store dimension derived from checkout URLs"
    columns:
      - name: store_key
        description: "Surrogate key for store"
        tests:
          - not_null
          - unique
      - name: store_id
        description: "Natural key for store"
      - name: store_domain
        description: "Domain extracted from checkout URL"
      - name: store_country
        description: "Country name mapped from store domain"
      - name: created_at
        description: "Record creation timestamp"
      - name: updated_at
        description: "Record update timestamp"

  - name: fact_sales_order_detail
    description: "Fact table for sales orders. One row per product per order."
    columns:
      - name: sales_order_detail_key
        description: "Surrogate key for fact row"
        tests:
          - not_null
          - unique
      - name: order_id
        description: "Order identifier"
        tests:
          - not_null
      - name: customer_key
        description: "Foreign key to dim_customer"
        tests:
          - not_null
      - name: product_key
        description: "Foreign key to dim_product"
        tests:
          - not_null
      - name: location_key
        description: "Foreign key to dim_location"
        tests:
          - not_null
      - name: store_key
        description: "Foreign key to dim_store"
        tests:
          - not_null
      - name: date_key
        description: "Foreign key to dim_date"
        tests:
          - not_null
      - name: quantity
        description: "Quantity of product ordered"
      - name: sale_price
        description: "Unit price in local currency"
      - name: sales_amount
        description: "Total amount in local currency (sale_price x quantity)"
      - name: sales_amount_eur
        description: "Total amount converted to EUR"
      - name: exchange_rate_to_eur
        description: "Exchange rate used for EUR conversion"
      - name: created_at
        description: "Record creation timestamp"
      - name: updated_at
        description: "Record update timestamp"
