version: 2

models:
  - name: dim_customer
    description: "Customer dimension with SCD Type 2. One row per user per email version. Source from ALL events."
    config:
      contract:
        enforced: true
    columns:
      - name: customer_key
        data_type: int64
        description: "Surrogate key generated by FARM_FINGERPRINT(user_id|email)."
        tests:
          - not_null
          - unique
      - name: user_id
        data_type: string
        description: "USER_ID_DB - natural key, logged-in user identifier."
        tests:
          - not_null
      - name: device_id
        data_type: string
        description: "Device identifier at time of event."
      - name: email
        data_type: string
        description: "Email address. UNKNOWN if not provided."
      - name: valid_from
        data_type: timestamp
        description: "Timestamp this record became effective (SCD Type 2)."
      - name: valid_to
        data_type: timestamp
        description: "Timestamp this record expired. 3000-01-01 = currently active."
      - name: is_current
        data_type: string
        description: "Y if current active record, N if historical (SCD Type 2)."
      - name: created_at
        data_type: timestamp
      - name: updated_at
        data_type: timestamp

  - name: dim_product
    description: "Product dimension from Glamira EU store. Includes UNKNOWN row (product_key = -1)."
    config:
      contract:
        enforced: true
    columns:
      - name: product_key
        data_type: int64
        description: "Surrogate key. -1 = Unknown."
        tests:
          - not_null
          - unique
      - name: product_id
        data_type: string
        tests:
          - not_null
      - name: product_name
        data_type: string
      - name: category_name
        data_type: string
      - name: product_type
        data_type: string
      - name: collection_name
        data_type: string
      - name: gender
        data_type: string
      - name: base_price
        data_type: numeric
        tests:
          - dbt_expectations.expect_column_min_to_be_between:
              min_value: 0
      - name: min_price
        data_type: numeric
      - name: max_price
        data_type: numeric
      - name: created_at
        data_type: timestamp
      - name: updated_at
        data_type: timestamp

  - name: dim_date
    description: "Date dimension covering Apr 2020 - Mar 2021."
    config:
      contract:
        enforced: true
    columns:
      - name: date_key
        data_type: int64
        tests:
          - not_null
          - unique
      - name: full_date
        data_type: date
      - name: hour
        data_type: int64
      - name: day
        data_type: int64
      - name: month
        data_type: int64
      - name: month_name
        data_type: string
      - name: year
        data_type: int64
      - name: quarter
        data_type: int64
      - name: day_name
        data_type: string
      - name: is_weekend
        data_type: bool
      - name: created_at
        data_type: timestamp
      - name: updated_at
        data_type: timestamp

  - name: dim_location
    description: "Geographic dimension. Includes UNKNOWN row (location_key = -1)."
    config:
      contract:
        enforced: true
    columns:
      - name: location_key
        data_type: int64
        tests:
          - not_null
          - unique
      - name: country_code
        data_type: string
      - name: country_name
        data_type: string
      - name: region_name
        data_type: string
      - name: city_name
        data_type: string
      - name: created_at
        data_type: timestamp
      - name: updated_at
        data_type: timestamp

  - name: dim_store
    description: "Store dimension. 65 stores. Includes UNKNOWN row (store_key = -1)."
    config:
      contract:
        enforced: true
    columns:
      - name: store_key
        data_type: int64
        tests:
          - not_null
          - unique
      - name: store_id
        data_type: string
      - name: store_domain
        data_type: string
      - name: store_country
        data_type: string
      - name: created_at
        data_type: timestamp
      - name: updated_at
        data_type: timestamp

  - name: dim_currency
    description: "Currency dimension. 35 currencies + UNKNOWN row."
    config:
      contract:
        enforced: true
    columns:
      - name: currency_key
        data_type: int64
        tests:
          - not_null
          - unique
      - name: currency_symbol
        data_type: string
      - name: currency_name
        data_type: string
      - name: created_at
        data_type: timestamp
      - name: updated_at
        data_type: timestamp

  - name: fact_sales_order_detail
    description: "Fact table for sales orders. One row per product per order. Incremental merge strategy."
    config:
      contract:
        enforced: true
    tests:
      - dbt_expectations.expect_compound_columns_to_be_unique:
          column_list: ["order_id", "product_key"]
      - dbt_expectations.expect_table_row_count_to_be_between:
          min_value: 20000
          max_value: 35000
    columns:
      - name: sales_order_detail_key
        data_type: int64
        tests:
          - not_null
          - unique
      - name: customer_key
        data_type: int64
        tests:
          - not_null
      - name: product_key
        data_type: int64
        tests:
          - not_null
      - name: location_key
        data_type: int64
        tests:
          - not_null
      - name: store_key
        data_type: int64
        tests:
          - not_null
      - name: currency_key
        data_type: int64
        tests:
          - not_null
      - name: date_key
        data_type: int64
        tests:
          - not_null
      - name: order_id
        data_type: string
        tests:
          - not_null
      - name: ip_address
        data_type: string
      - name: local_time
        data_type: timestamp
      - name: alloy_name
        data_type: string
      - name: stone_name
        data_type: string
      - name: quantity
        data_type: int64
        tests:
          - dbt_expectations.expect_column_min_to_be_between:
              min_value: 0
      - name: sale_price
        data_type: numeric
        tests:
          - dbt_expectations.expect_column_min_to_be_between:
              min_value: 0
      - name: sales_amount
        data_type: numeric
        tests:
          - dbt_expectations.expect_column_min_to_be_between:
              min_value: 0
      - name: created_at
        data_type: timestamp
      - name: updated_at
        data_type: timestamp

  - name: fact_exchange_rate
    description: "Exchange rate fact table. Fixed rates Apr 2020."
    config:
      contract:
        enforced: true
    columns:
      - name: exchange_rate_key
        data_type: int64
        tests:
          - not_null
          - unique
      - name: currency_key
        data_type: int64
        tests:
          - not_null
      - name: rate_to_eur
        data_type: numeric
        tests:
          - dbt_expectations.expect_column_min_to_be_between:
              min_value: 0
      - name: created_at
        data_type: timestamp
      - name: updated_at
        data_type: timestamp
