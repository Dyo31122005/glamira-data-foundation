version: 2

models:
  - name: dim_customer
    description: "Customer dimension with PII masked. SCD Type 2 — tracks changes over time. One row per device per version."
    config:
      contract:
        enforced: true
    columns:
      - name: customer_key
        data_type: int64
        description: "Surrogate key generated by FARM_FINGERPRINT(device_id)."
        tests:
          - not_null
          - unique
      - name: device_id
        data_type: string
        description: "Device identifier — natural key."
        tests:
          - not_null
      - name: email_hashed
        data_type: string
        description: "MD5 hashed email address (PII masked)."
      - name: has_email
        data_type: bool
        description: "True if customer provided email at checkout."
      - name: effective_date
        data_type: date
        description: "Date this record became effective (SCD Type 2)."
      - name: expiry_date
        data_type: date
        description: "Date this record expired. 9999-12-31 = currently active (SCD Type 2)."
      - name: is_current
        data_type: bool
        description: "True if this is the current active record (SCD Type 2)."
      - name: created_at
        data_type: timestamp
        description: "Record creation timestamp."
      - name: updated_at
        data_type: timestamp
        description: "Record last update timestamp."

  - name: dim_product
    description: "Product dimension from Glamira EU store. Coverage 79.78% — 20.22% missing due to crawler Access Denied at source. Includes UNKNOWN row (product_key = -1)."
    config:
      contract:
        enforced: true
    columns:
      - name: product_key
        data_type: int64
        description: "Surrogate key generated by FARM_FINGERPRINT(product_id). -1 = Unknown."
        tests:
          - not_null
          - unique
      - name: product_id
        data_type: string
        description: "Natural key from Glamira product catalog."
        tests:
          - not_null
      - name: product_name
        data_type: string
        description: "Product display name."
      - name: category_name
        data_type: string
        description: "Product category (e.g. Ring, Earring, Pendant)."
      - name: product_type
        data_type: string
        description: "Standardized product type. Unknown if missing or invalid."
      - name: collection_name
        data_type: string
        description: "Product collection name."
      - name: gender
        data_type: string
        description: "Target gender: Women, Men, Unisex."
      - name: base_price
        data_type: numeric
        description: "Base price in EUR."
      - name: min_price
        data_type: numeric
        description: "Minimum configurable price in EUR."
      - name: max_price
        data_type: numeric
        description: "Maximum configurable price in EUR."
      - name: created_at
        data_type: timestamp
        description: "Record creation timestamp."
      - name: updated_at
        data_type: timestamp
        description: "Record last update timestamp."

  - name: dim_date
    description: "Date dimension covering Apr 2020 - Mar 2021 (365 days)."
    config:
      contract:
        enforced: true
    columns:
      - name: date_key
        data_type: int64
        description: "Integer date key in YYYYMMDD format."
        tests:
          - not_null
          - unique
      - name: full_date
        data_type: date
        description: "Full calendar date."
      - name: hour
        data_type: int64
        description: "Hour of the day (0-23)."
      - name: day
        data_type: int64
        description: "Day of the month (1-31)."
      - name: month
        data_type: int64
        description: "Month number (1-12)."
      - name: month_name
        data_type: string
        description: "Full month name (e.g. January, February)."
      - name: year
        data_type: int64
        description: "Calendar year."
      - name: quarter
        data_type: int64
        description: "Quarter number (1-4)."
      - name: day_name
        data_type: string
        description: "Full day name (e.g. Monday, Tuesday)."
      - name: is_weekend
        data_type: bool
        description: "True if Saturday or Sunday."
      - name: created_at
        data_type: timestamp
        description: "Record creation timestamp."
      - name: updated_at
        data_type: timestamp
        description: "Record last update timestamp."

  - name: dim_location
    description: "Geographic dimension from IP geolocation. One row per unique country + region + city. Includes UNKNOWN row (location_key = -1)."
    config:
      contract:
        enforced: true
    columns:
      - name: location_key
        data_type: int64
        description: "Surrogate key generated by FARM_FINGERPRINT(country|region|city). -1 = Unknown."
        tests:
          - not_null
          - unique
      - name: country_code
        data_type: string
        description: "ISO 2-letter country code."
      - name: country_name
        data_type: string
        description: "Full country name."
      - name: region_name
        data_type: string
        description: "Region or state name."
      - name: city_name
        data_type: string
        description: "City name."
      - name: created_at
        data_type: timestamp
        description: "Record creation timestamp."
      - name: updated_at
        data_type: timestamp
        description: "Record last update timestamp."

  - name: dim_store
    description: "Store dimension derived from checkout URLs. 65 stores across 50+ countries. Includes UNKNOWN row (store_key = -1)."
    config:
      contract:
        enforced: true
    columns:
      - name: store_key
        data_type: int64
        description: "Surrogate key generated by FARM_FINGERPRINT(store_id). -1 = Unknown."
        tests:
          - not_null
          - unique
      - name: store_id
        data_type: string
        description: "Natural key — store ID from checkout events."
      - name: store_domain
        data_type: string
        description: "Domain extracted from checkout URL (e.g. de, co.uk, com.au)."
      - name: store_country
        data_type: string
        description: "Country name mapped from store domain."
      - name: created_at
        data_type: timestamp
        description: "Record creation timestamp."
      - name: updated_at
        data_type: timestamp
        description: "Record last update timestamp."

  - name: dim_currency
    description: "Currency dimension with all currencies from checkout events. Includes UNKNOWN row (currency_key = -1)."
    config:
      contract:
        enforced: true
    columns:
      - name: currency_key
        data_type: int64
        description: "Surrogate key generated by FARM_FINGERPRINT(currency_symbol). -1 = Unknown."
        tests:
          - not_null
          - unique
      - name: currency_symbol
        data_type: string
        description: "Currency symbol (e.g. €, £, $)."
      - name: currency_name
        data_type: string
        description: "Full currency name (e.g. Euro, British Pound)."
      - name: created_at
        data_type: timestamp
        description: "Record creation timestamp."
      - name: updated_at
        data_type: timestamp
        description: "Record last update timestamp."

  - name: fact_sales_order_detail
    description: "Fact table for sales orders. One row per product per order. JOIN fact_exchange_rate for EUR conversion."
    config:
      contract:
        enforced: true
    columns:
      - name: sales_order_detail_key
        data_type: int64
        description: "Surrogate key generated by FARM_FINGERPRINT(order_id|product_key)."
        tests:
          - not_null
          - unique
      - name: customer_key
        data_type: int64
        description: "Foreign key to dim_customer. -1 = Unknown."
        tests:
          - not_null
      - name: product_key
        data_type: int64
        description: "Foreign key to dim_product. -1 = Unknown."
        tests:
          - not_null
      - name: location_key
        data_type: int64
        description: "Foreign key to dim_location. -1 = Unknown."
        tests:
          - not_null
      - name: store_key
        data_type: int64
        description: "Foreign key to dim_store. -1 = Unknown."
        tests:
          - not_null
      - name: currency_key
        data_type: int64
        description: "Foreign key to dim_currency. -1 = Unknown."
        tests:
          - not_null
      - name: date_key
        data_type: int64
        description: "Foreign key to dim_date. -1 = Unknown."
        tests:
          - not_null
      - name: order_id
        data_type: string
        description: "Order identifier — natural key."
        tests:
          - not_null
      - name: ip_hashed
        data_type: string
        description: "MD5 hashed IP address at time of order (PII masked)."
      - name: local_time
        data_type: timestamp
        description: "Local time of the order. Fallback to 3000-01-01 if null."
      - name: alloy_name
        data_type: string
        description: "Metal/alloy selected (e.g. 14K White Gold)."
      - name: stone_name
        data_type: string
        description: "Stone/diamond selected (e.g. Diamond, Sapphire)."
      - name: quantity
        data_type: int64
        description: "Quantity of product ordered (additive)."
      - name: sale_price
        data_type: numeric
        description: "Unit price in local currency (non-additive)."
      - name: sales_amount
        data_type: numeric
        description: "Total amount in local currency — sale_price x quantity (additive within same currency)."
      - name: created_at
        data_type: timestamp
        description: "Record creation timestamp."
      - name: updated_at
        data_type: timestamp
        description: "Record last update timestamp."

  - name: fact_exchange_rate
    description: "Exchange rate fact table. Fixed rates for Apr 2020. One row per currency. JOIN with fact_sales_order_detail on currency_key for EUR conversion."
    config:
      contract:
        enforced: true
    columns:
      - name: exchange_rate_key
        data_type: int64
        description: "Surrogate key generated by FARM_FINGERPRINT(currency_key)."
        tests:
          - not_null
          - unique
      - name: currency_key
        data_type: int64
        description: "Foreign key to dim_currency."
        tests:
          - not_null
      - name: rate_to_eur
        data_type: numeric
        description: "Exchange rate to EUR (non-additive measure)."
      - name: created_at
        data_type: timestamp
        description: "Record creation timestamp."
      - name: updated_at
        data_type: timestamp
        description: "Record last update timestamp."
