version: 2

models:
  - name: stg_dim_customer
    description: "Staging for dim_customer. Source from ALL events (excluding checkout_success). Filter logged-in users with USER_ID_DB + email. Includes rn_asc/rn_desc for SCD Type 2."
    columns:
      - name: user_id
        description: "USER_ID_DB - logged-in user identifier."
        tests:
          - not_null
      - name: device_id
        description: "Device identifier."
      - name: email_address
        description: "Email address (lowercased, trimmed)."
      - name: event_timestamp
        description: "Event timestamp."
      - name: rn_asc
        description: "Row number ascending — used for valid_from."
      - name: rn_desc
        description: "Row number descending — used for valid_to."

  - name: stg_dim_store
    description: "Staging for dim_store. Source from checkout_success — store_id + current_url."
    columns:
      - name: store_id
        description: "Store identifier."
        tests:
          - not_null
      - name: current_url
        description: "Checkout URL for extracting store domain."

  - name: stg_dim_currency
    description: "Staging for dim_currency. Source from checkout_success — currency symbol + name mapping."
    columns:
      - name: currency_symbol
        description: "Currency symbol from cart products."
      - name: currency_name
        description: "Full currency name (mapped)."

  - name: stg_fact_sales
    description: "Staging for fact_sales. Source from checkout_success with cart products unpivoted. Price cleaned from 3 formats. Null currency fallback to EUR."
    columns:
      - name: event_id
        description: "MongoDB event ID."
        tests:
          - not_null
      - name: order_id
        description: "Order identifier."
        tests:
          - not_null
      - name: product_id
        description: "Product ID from cart."
        tests:
          - not_null
      - name: quantity
        description: "Quantity of product ordered."
        tests:
          - not_null
      - name: currency
        description: "Currency symbol."
      - name: sale_price
        description: "Cleaned unit price."

  - name: stg_ip_location
    description: "IP geolocation data."
    columns:
      - name: ip
        tests:
          - not_null
          - unique
      - name: country_code
      - name: country_name
      - name: region_name
      - name: city_name

  - name: stg_products
    description: "Product data from product_react_data_eu."
    columns:
      - name: product_id
        tests:
          - not_null
          - unique
